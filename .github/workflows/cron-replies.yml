name: NexRep Scheduled Review Processing

on:
  schedule:
    # Runs every 15 minutes (alternative for Vercel Hobby plan)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  process-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NexRep Review Processing Endpoint
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL secret not set. Skipping scheduled trigger."
            exit 0
          fi
          
          TARGET_URL="${SITE_URL%/}/api/cron/process-replies"
          echo "Invoking $TARGET_URL..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: NexRep-GitHub-Cron/1.0")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Cron trigger returned non-200 status code: $HTTP_STATUS"
            exit 1
          fi
