<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="nr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="nr-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="nr-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="nr-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 1. Green Rounded-Square Base (Squircle) -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#nr-bg)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#nr-shadow)"/>

  <!-- 2. Customer Review Speech Bubble -->
  <path d="M12.5 13C10.5 13 9 14.5 9 16.5V26.5C9 28.5 10.5 30 12.5 30H14.5V34.8C14.5 35.45 15.25 35.8 15.75 35.35L21 30.5C21.4 30.2 21.9 30 22.4 30H35.5C37.5 30 39 28.5 39 26.5V16.5C39 14.5 37.5 13 35.5 13H12.5Z" fill="#022C22" fill-opacity="0.45" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- 3. Rating Star Emblem (Customer Satisfaction) -->
  <path d="M19.5 16.5L21.1 20L24.8 20.3L22 22.8L22.8 26.5L19.5 24.5L16.2 26.5L17 22.8L14.2 20.3L17.9 20L19.5 16.5Z" fill="url(#nr-star)" filter="drop-shadow(0 1px 2px rgba(2, 44, 34, 0.4))"/>

  <!-- 4. Dynamic Upward Growth Arrow (Business Reputation & Review Acceleration) -->
  <path d="M23 26.5L31.5 18" stroke="url(#nr-accent)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M26.5 17.5H32V23" stroke="url(#nr-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. Excellence Sparkle (Reputation Polish) -->
  <path d="M37 9C37 10.5 35.5 11.5 34.5 11.5C35.5 11.5 37 12.5 37 14C37 12.5 38.5 11.5 39.5 11.5C38.5 11.5 37 10.5 37 9Z" fill="#A7F3D0"/>
</svg>
