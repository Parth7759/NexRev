  <!-- WORDMARK: "NexRep" -->
  <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#0A3022">
    Nex<tspan fill="#059669">Rep</tspan>
  </text>

  <!-- TAGLINE: "by NexFlowOps" -->
  <text x="56.5" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8" fill="#047857" fill-opacity="0.95">
    by NexFlowOps
